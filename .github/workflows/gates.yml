# The gates of spec B §2.2, §11.1 and §13 item 28, given a runner.
#
# Until this file existed they had none. deps_test.go was written to replace §2.2's CI shell
# line and argued, correctly, that a CI-only gate cannot tell a developer anything before the
# push — but the repository carried no CI at all, so the gate it replaced ran on every commit
# and the gate that replaced it ran only when somebody typed `go test` by hand. That is
# strictly worse than the line it removed, and this is the half that was missing.
#
# The Postgres service is here because the store arrived. §13's items 2, 4 and 5 are the store
# contract, and half of it — [store.RunContract] against the pgx implementation — needs a real
# database and skips without one. A skip contributes nothing to the `ok` line, so before this
# service existed the job would have reported a green suite that executed §6.1's transaction
# against PostgreSQL exactly zero times, with store/coverage_test.go's PARTIAL RUN banner
# printing into a log nobody opens on a passing job.

name: gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest

    services:
      # §3.1 makes the cluster's timezone normative and store.CheckClock asserts it at every
      # pool, so the image matters less than the fact that there IS one. 17 is what the store
      # is developed against.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: urmessage_ci
          POSTGRES_DB: urmessage_test
        ports:
          - 5432:5432
        # the suite creates and drops a schema per contract scenario, so the job must not start
        # until the cluster accepts connections; without the health check the first store built
        # panics on a refused connection and the failure names the pool rather than the race
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Every package of this module, and every test in it.
      #
      # Both halves of that are the same rule and this job got the first half right and the
      # second half wrong for one release. `-run` takes a pattern that matches every test
      # rather than an alternation of their names, because a hand-typed list of what to run
      # understates what is there exactly the way a hand-typed list of what to ban understates
      # what is banned — and then the package argument was the single directory `.`, which is
      # the same mistake one level up. The root package held every gate when this file was
      # written; api/ and store/ now hold the §5.1 check-order gates, the no-second-
      # implementation gates and the store contract, and this job ran none of them. A gate that
      # is off reports the same green run as a gate that passed.
      #
      # -v so the run prints PASS, FAIL and SKIP per test and not just a total: a suite counted
      # by its passes alone is how a failing test got committed here.
      #
      # The two variables are the same rule as -v, one level up. URMESSAGE_TEST_DSN is what makes
      # the pgx half of the store contract RUN; URMESSAGE_REQUIRE_CONTRACT_COVERAGE is what makes
      # this job fail if it somehow did not — a DSN typo, a service that never came up, a
      # migration that panicked the harness — instead of passing with a banner saying so. A job
      # that only sets the first one is a job whose most expensive coverage can vanish silently.
      #
      # The timeout is minutes rather than the five this job used to allow because the contract
      # builds a schema per scenario and §3.4 puts 64 partitions on two of its tables, so the
      # store package alone is several minutes of DDL before it asserts anything.
      - name: every gate and every suite
        env:
          URMESSAGE_TEST_DSN: postgres://postgres:urmessage_ci@127.0.0.1:5432/urmessage_test
          URMESSAGE_REQUIRE_CONTRACT_COVERAGE: "1"
        run: go test -v -run '.' -timeout 30m ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt would rewrite:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Every configuration release-platforms.txt names, built from that file rather than from
      # a matrix retyped here. deps_test.go measures the same file, so a platform this job
      # builds is a platform the dependency rule was checked against.
      - name: build every released platform
        run: |
          set -eu
          built=0
          while read -r platform settings; do
            case "$platform" in ''|'#'*) continue ;; esac
            goos="${platform%%/*}"
            goarch="${platform##*/}"
            cgo=0
            tags=''
            for setting in $settings; do
              case "$setting" in
                cgo=*)  cgo="${setting#cgo=}" ;;
                tags=*) tags="${setting#tags=}" ;;
                '#'*)   break ;;
                *)      printf 'release-platforms.txt: %s is not a setting this job knows\n' "$setting"; exit 1 ;;
              esac
            done
            printf '\n== %s/%s cgo=%s tags=%s ==\n' "$goos" "$goarch" "$cgo" "$tags"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED="$cgo" go build ${tags:+-tags "$tags"} ./...
            built=$((built + 1))
          done < release-platforms.txt
          if [ "$built" -eq 0 ]; then
            echo 'release-platforms.txt named no platform, so this job built nothing'
            exit 1
          fi
          printf '\nbuilt %d released platforms\n' "$built"
